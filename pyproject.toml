[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vapix-python"
dynamic = ["version"]
description = "Python wrapper for the Axis Communications VAPIX camera API"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "derens99" }]
keywords = ["axis", "vapix", "camera", "ptz", "ip-camera"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://github.com/derens99/vapix-python"
Issues = "https://github.com/derens99/vapix-python/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.hatch.version]
path = "src/vapix_python/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vapix_python"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "UP007", # keep Optional[X] for Python 3.9 compatibility in runtime positions
]

[tool.ruff.lint.per-file-ignores]
# Deprecated compat shims intentionally shadow their own class names
"src/vapix_python/VapixAPI.py" = ["E402"]
"src/vapix_python/PTZControl.py" = ["E402"]
"src/vapix_python/GeolocationAPI.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
